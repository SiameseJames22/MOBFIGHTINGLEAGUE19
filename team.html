<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mob Profile Manager</title>
  <style>
    :root { --bg:#0b0f14; --card:#121a24; --text:#e7eefc; --muted:#98a6bf; --accent:#4aa3ff; --danger:#ff4a4a; --ok:#3dff8b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
    
    /* Header Area Layout */
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 15px; }
    .team-title { display: flex; align-items: center; gap: 15px; }
    .ai-logo { width: 64px; height: 64px; border-radius: 14px; background: radial-gradient(circle, #243b55, #141e30); display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid var(--accent); box-shadow: 0 0 10px rgba(74,163,255,0.3); }
    .manager-badge { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }

    /* Core Layout Sections */
    .profile-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 900px) { .profile-grid { grid-template-columns: 300px 1fr 350px; } }
    
    .card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 18px; }
    h3 { margin: 0 0 12px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.06); padding-bottom: 6px;}
    
    /* Left: Player Sidebar List */
    .player-list { display: grid; gap: 8px; max-height: 550px; overflow-y: auto; padding-right: 4px; }
    .player-row { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.15); padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.04); }
    .player-img { width: 36px; height: 36px; background: rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }

    /* Center: Bio & Trophies */
    .bio-box { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 20px; background: rgba(0,0,0,0.15); padding: 12px; border-radius: 12px; }
    .trophy-shelf { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .trophy-item { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; text-align: center; flex: 1; min-width: 90px; }
    .trophy-icon { font-size: 24px; margin-bottom: 4px; }

    /* Right: Interactive Formation Pitch */
    .pitch { background: #1e4620; border: 3px solid rgba(255,255,255,0.2); border-radius: 14px; height: 320px; position: relative; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }
    .pitch-line { position: absolute; border: 1px solid rgba(255,255,255,0.2); }
    .pitch-center { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; }
    .pitch-half { top: 50%; left: 0; right: 0; height: 1px; }
    .pitch-box { bottom: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 50px; border-top: 1px solid rgba(255,255,255,0.2); }
    
    .pitch-player { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
    .pitch-dot { width: 14px; height: 14px; background: var(--accent); border: 2px solid white; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .pitch-pname { font-size: 10px; background: rgba(0,0,0,0.75); padding: 2px 4px; border-radius: 4px; margin-top: 2px; white-space: nowrap; font-weight: bold; }

    /* Right: Current Season Standings Block */
    .stats-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
    .stats-row span:last-child { font-weight: bold; color: var(--accent); }
    .btn-back { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; font-size: 13px; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="team-title">
      <div class="ai-logo" id="teamLogo">👾</div>
      <div>
        <h1 id="teamHeaderName" style="margin:0; font-size:26px; font-weight:800;">Loading Team...</h1>
        <div class="small" style="color:var(--muted); margin-top:2px;">AI Personalized Profile Generation</div>
      </div>
    </div>
    <div class="manager-badge">
      <div style="font-size: 20px;">👤</div>
      <div style="text-align: right;">
        <div style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Manager</div>
        <div id="managerName" style="font-size: 13px; font-weight: bold;">The Overlord</div>
      </div>
    </div>
  </header>

  <div class="profile-grid">
    <aside class="card">
      <h3>Squad Players</h3>
      <div class="player-list" id="playerListWrapper"></div>
    </aside>

    <main class="card">
      <h3>Team Biography</h3>
      <div class="bio-box" id="teamBio"></div>

      <h3>Honours & Trophies</h3>
      <div class="trophy-shelf" id="trophyShelf"></div>
    </main>

    <section style="display: grid; gap: 20px; align-content: start;">
      <div class="card">
        <h3>Team Formation (4-3-3)</h3>
        <div class="pitch">
          <div class="pitch-line pitch-center"></div>
          <div class="pitch-line pitch-half"></div>
          <div class="pitch-line pitch-box"></div>
          
          <div class="pitch-player" style="bottom: 8%; left: 50%;"><div class="pitch-dot" style="background:#ffcc00;"></div><div class="pitch-pname" id="pos-gk">GK</div></div>
          <div class="pitch-player" style="bottom: 25%; left: 35%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-cb1">CB</div></div>
          <div class="pitch-player" style="bottom: 25%; left: 65%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-cb2">CB</div></div>
          <div class="pitch-player" style="bottom: 32%; left: 15%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-lb">LB</div></div>
          <div class="pitch-player" style="bottom: 32%; left: 85%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-rb">RB</div></div>
          <div class="pitch-player" style="bottom: 52%; left: 50%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-cm">CM</div></div>
          <div class="pitch-player" style="bottom: 58%; left: 25%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-lm">LM</div></div>
          <div class="pitch-player" style="bottom: 58%; left: 75%;"><div class="pitch-dot"></div><div class="pitch-pname" id="pos-rm">RM</div></div>
          <div class="pitch-player" style="bottom: 82%; left: 50%;"><div class="pitch-dot" style="background:var(--danger);"></div><div class="pitch-pname" id="pos-st">ST</div></div>
          <div class="pitch-player" style="bottom: 78%; left: 20%;"><div class="pitch-dot" style="background:var(--danger);"></div><div class="pitch-pname" id="pos-lw">LW</div></div>
          <div class="pitch-player" style="bottom: 78%; left: 80%;"><div class="pitch-dot" style="background:var(--danger);"></div><div class="pitch-pname" id="pos-rw">RW</div></div>
        </div>
      </div>

      <div class="card">
        <h3>Current Season Stats</h3>
        <div id="statsContainer"></div>
        <div style="margin-top:15px; text-align:right;">
          <a href="./index.html" class="btn-back">← Back to Standings</a>
        </div>
      </div>
    </section>
  </div>
</div>

<script type="module">
  // Read target setup name out of page route strings
  const params = new URLSearchParams(window.location.search);
  const teamName = params.get("name") || "Creeper Town United";

  // Clean root singular word form tags out of team arrays to structure naming scripts
  const baseName = teamName.replace(/(FC|United|Athletic|Rovers|Rangers|City|Town|Albion)/g, "").trim();
  const rootMob = baseName.replace(/s$/, ""); // e.g. "Creepers" -> "Creeper"

  // 1. AI THEMED ICON GENERATOR
  const mobIcons = {
    "Creeper": "💣", "Zombie": "🧟", "Skeleton": "💀", "Enderman": "🔮", "Warden": "🔊",
    "Fox": "🦊", "Wolf": "🐺", "Wither": "☠️", "Spider": "🕷️", "Slime": "🟢", "Pig": "🐷"
  };
  document.getElementById("teamLogo").textContent = mobIcons[rootMob] || "👾";
  document.getElementById("teamHeaderName").textContent = teamName.toUpperCase();
  document.getElementById("managerName").textContent = `The ${rootMob} Master`;

  // 2. GENERATING UNIQUE THEMED SQUAD PLAYERS
  const playerPrefixes = ["Giant", "Altered", "Mega", "Stalker", "Sneaky", "Aggressive", "Shadow", "Mutant", "Alpha", "Hyper", "Elite"];
  const positions = [
    { pos: "GK", id: "pos-gk" }, { pos: "DF", id: "pos-lb" }, { pos: "DF", id: "pos-cb1" },
    { pos: "DF", id: "pos-cb2" }, { pos: "DF", id: "pos-rb" }, { pos: "MF", id: "pos-lm" },
    { pos: "MF", id: "pos-cm" }, { pos: "MF", id: "pos-rm" }, { pos: "FW", id: "pos-lw" },
    { pos: "FW", id: "pos-st" }, { pos: "FW", id: "pos-rw" }
  ];

  let playerListHtml = "";
  positions.forEach((p, index) => {
    const pName = `${playerPrefixes[(index + baseName.length) % playerPrefixes.length]} ${rootMob}`;
    
    // Add to list column layout
    playerListHtml += `
      <div class="player-row">
        <div class="player-img">${mobIcons[rootMob] || "⚔️"}</div>
        <div style="flex:1;">
          <div style="font-size:13px; font-weight:bold;">${pName}</div>
          <div style="font-size:11px; color:var(--muted);">${p.pos}</div>
        </div>
      </div>
    `;

    // Inject directly onto the tactics field line dots
    const fieldLabel = document.getElementById(p.id);
    if (fieldLabel) fieldLabel.textContent = pName;
  });
  document.getElementById("playerListWrapper").innerHTML = playerListHtml;

  // 3. AI THEMED BIOGRAPHY
  document.getElementById("teamBio").textContent = `
    Founded in the depths of the Minecraft biomes, ${teamName} has established an absolute reign of terror in the league. 
    Known for utilizing native ${rootMob} attributes to surprise opposing setups, their tactical focus relies completely on absolute power and swarm maneuvers.
    This profile layout, along with the rosters and history records, has been cleanly assembled via dynamic engine presets.
  `;

  // 4. ACHIEVEMENTS & HISTORICAL RECORD GENERATION
  document.getElementById("trophyShelf").innerHTML = `
    <div class="trophy-item"><div class="trophy-icon">🏆</div><div style="font-size:11px; font-weight:bold;">Season 1</div><div style="font-size:9px; color:var(--muted);">Champ</div></div>
    <div class="trophy-item"><div class="trophy-icon">👑</div><div style="font-size:11px; font-weight:bold;">Royale Cup</div><div style="font-size:9px; color:var(--muted);">Winner</div></div>
    <div class="trophy-item"><div class="trophy-icon">🛡️</div><div style="font-size:11px; font-weight:bold;">Supercup</div><div style="font-size:9px; color:var(--muted);">Finalist</div></div>
  `;

  // 5. SEASON STAT TRACKING
  document.getElementById("statsContainer").innerHTML = `
    <div class="stats-row"><span>League Tier</span><span>Dynamic Tier Placement</span></div>
    <div class="stats-row"><span>Goals Scored</span><span>${25 + baseName.length * 3}</span></div>
    <div class="stats-row"><span>Goals Conceded</span><span>${12 + baseName.length}</span></div>
    <div class="stats-row"><span>Clean Sheets</span><span>${4 + (baseName.length % 4)}</span></div>
  `;
</script>

</body>
</html>
